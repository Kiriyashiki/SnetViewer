plugins {
    id 'java'
    id 'application'
}

group = 'xyz.hainaut.snetviewer'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'xyz.hainaut.snetviewer.App'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'xyz.hainaut.snetviewer.App',
            'Implementation-Title': 'SnetViewer',
            'Implementation-Version': project.version
        )
    }
}
